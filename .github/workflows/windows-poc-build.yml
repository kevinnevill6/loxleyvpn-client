name: Windows PoC Build

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: Windows build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

concurrency:
  group: windows-poc-build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.10.3
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  windows-x64:
    name: Windows x64 ${{ inputs.build_config }}
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 10

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools
          dir: ${{ runner.temp }}
          setup-python: true
          set-env: true
          aqtversion: ==3.3.0
          py7zrversion: ==0.22.*
          extra: --base ${{ env.QT_MIRROR }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Conan
        run: pip install "conan==2.29.0"

      - name: Build Windows client
        shell: pwsh
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: |
          cmd /c "deploy\build.bat --config ${{ inputs.build_config }} --architecture amd64" 2>&1 |
            Tee-Object -FilePath windows-poc-build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LoxleyVPN-windows-x64-${{ inputs.build_config }}-build-log
          path: windows-poc-build.log
          retention-days: 7

      - name: Package Windows portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildConfig = "${{ inputs.build_config }}"
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "deploy/build/client/$buildConfig"
          $portableDir = Join-Path $env:GITHUB_WORKSPACE "deploy/build/LoxleyVPN-WINDOWS-x64-$buildConfig-PoC"
          $sourceExe = Join-Path $buildDir "AmneziaVPN.exe"
          $targetExe = Join-Path $portableDir "LoxleyVPN.exe"

          if (!(Test-Path $sourceExe)) {
            throw "Expected Windows executable was not found: $sourceExe"
          }

          if (Test-Path $portableDir) {
            Remove-Item $portableDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $portableDir | Out-Null

          Copy-Item $sourceExe $targetExe -Force
          Get-ChildItem $buildDir -File |
            Where-Object { @(".exp", ".lib", ".pdb", ".ilk") -notcontains $_.Extension -and $_.Name -ne "AmneziaVPN.exe" } |
            Copy-Item -Destination $portableDir -Force

          $qmlDir = Join-Path $env:GITHUB_WORKSPACE "client/ui/qml"
          $deployArgs = @("--compiler-runtime", "--qmldir", $qmlDir)
          if ($buildConfig -eq "Debug") {
            $deployArgs += "--debug"
          } else {
            $deployArgs += "--release"
          }
          $deployArgs += $targetExe

          windeployqt @deployArgs

          @(
            "LoxleyVPN Windows x64 $buildConfig PoC"
            ""
            "How to run:"
            "1. Extract this ZIP archive to a normal folder."
            "2. Open the extracted folder."
            "3. Run LoxleyVPN.exe."
            ""
            "This is a technical PoC build, not a signed installer."
          ) | Set-Content -Encoding UTF8 (Join-Path $portableDir "README-WINDOWS.txt")

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v7
        with:
          name: LoxleyVPN-WINDOWS-x64-${{ inputs.build_config }}-PoC
          path: deploy/build/LoxleyVPN-WINDOWS-x64-${{ inputs.build_config }}-PoC/
          retention-days: 7
